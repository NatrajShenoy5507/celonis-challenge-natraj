name: AI quality analysis

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Call Gemini using the configured GEMINI_API_KEY secret
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  deterministic-and-ai:
    name: Deterministic findings and optional Gemini analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Generate deterministic findings
        run: npm run reconcile

      - name: Validate findings are ready for AI
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const path = "reconciliation/output/defects.json";
          if (!fs.existsSync(path)) {
            throw new Error(`Expected deterministic findings were not generated: ${path}`);
          }
          const findings = JSON.parse(fs.readFileSync(path, "utf8"));
          if (!Array.isArray(findings) || !findings.every((finding) =>
            typeof finding.id === "string" &&
            typeof finding.caseId === "string" &&
            typeof finding.category === "string" &&
            typeof finding.severity === "string"
          )) {
            throw new Error("Deterministic findings do not match the expected array schema.");
          }
          console.log(`Deterministic findings are ready (${findings.length} finding(s)).`);

      - name: Check offline AI guardrail test availability
        shell: bash
        run: |
          echo "::notice::No runnable offline/mock AI guardrail test command is defined in the repository; no substitute test command will be invented."

      - name: Verify live Gemini secret is configured when requested
        if: inputs.run_live
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::error::Live analysis was requested but GEMINI_API_KEY is not configured in GitHub Actions Secrets."
            exit 1
          fi
          echo "GEMINI_API_KEY is configured."

      - name: Run live Gemini analysis
        if: inputs.run_live
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:explain

      - name: Verify successful run wrote a valid analysis
        if: inputs.run_live
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const findings = JSON.parse(fs.readFileSync("reconciliation/output/defects.json", "utf8"));
          const outputPath = "ai/output/ai-analysis.json";
          if (!fs.existsSync(outputPath)) {
            throw new Error("Gemini command exited without writing the validated analysis.");
          }
          const analysis = JSON.parse(fs.readFileSync(outputPath, "utf8"));
          if (
            typeof analysis.overallSummary !== "string" ||
            !Array.isArray(analysis.caseAnalyses)
          ) {
            throw new Error("AI analysis does not match the validated response structure.");
          }
          const expected = new Set(findings.map((finding) => finding.id));
          const returned = analysis.caseAnalyses.flatMap((item) => item.findingIds || []);
          if (
            returned.length !== expected.size ||
            new Set(returned).size !== returned.length ||
            returned.some((id) => !expected.has(id))
          ) {
            throw new Error("AI analysis finding IDs do not exactly cover deterministic findings.");
          }
          console.log(`Validated output structure and coverage for ${returned.length} finding(s).`);

      - name: Keep AI output off artifacts by default
        if: always() && inputs.run_live
        run: echo "::notice::AI analysis is not printed or uploaded because it contains case-level business evidence; run the existing command in a trusted local environment to inspect the generated file."
