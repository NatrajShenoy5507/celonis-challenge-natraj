name: AI quality analysis

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: Call Gemini using the configured GEMINI_API_KEY secret
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  offline-validation:
    name: Deterministic and offline AI guardrail tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Generate deterministic findings
        run: npm run reconcile

      - name: Run mocked AI guardrail tests
        run: node --test ai/test/anomaly-explainer.test.js

  live-analysis:
    name: Optional live Gemini analysis
    needs: offline-validation
    if: github.event_name == 'workflow_dispatch' && inputs.run_live == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Generate deterministic findings
        run: npm run reconcile

      - name: Verify live Gemini secret is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::error::Live analysis was requested but GEMINI_API_KEY is not configured in GitHub Actions Secrets."
            exit 1
          fi
          echo "GEMINI_API_KEY is configured."

      - name: Run live Gemini analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:explain

      - name: Verify validated analysis covers deterministic findings
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const findings = JSON.parse(fs.readFileSync("reconciliation/output/defects.json", "utf8"));
          const outputPath = "ai/output/ai-analysis.json";
          if (!fs.existsSync(outputPath)) {
            throw new Error("Gemini command exited without writing validated analysis.");
          }
          const analysis = JSON.parse(fs.readFileSync(outputPath, "utf8"));
          if (
            typeof analysis.overallSummary !== "string" ||
            !Array.isArray(analysis.caseAnalyses)
          ) {
            throw new Error("AI analysis does not match the persisted validated structure.");
          }
          const expected = new Set(findings.map((finding) => finding.id));
          const returned = analysis.caseAnalyses.flatMap((item) => item.findingIds || []);
          if (
            returned.length !== expected.size ||
            new Set(returned).size !== returned.length ||
            returned.some((id) => !expected.has(id))
          ) {
            throw new Error("AI analysis finding IDs do not exactly cover deterministic findings.");
          }
          console.log(`Validated output structure and coverage for ${returned.length} finding(s).`);

      - name: Keep AI output off artifacts
        if: always()
        run: echo "::notice::AI analysis is not printed or uploaded because it contains case-level business evidence."
